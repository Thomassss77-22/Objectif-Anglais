# Publie le dossier app/ sur GitHub Pages.
# L'environnement github-pages n'autorise que la branche par défaut du dépôt
# (claude/serene-goldberg-adja16) : le déploiement part donc de cette branche.
name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/serene-goldberg-adja16]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      # L'artefact met parfois quelques secondes à devenir visible pour l'étape suivante.
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
